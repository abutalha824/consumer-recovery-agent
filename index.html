<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consumer Recovery</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
      color: #172033;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
    }

    .subtitle {
      color: #667085;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: #f0fdf4;
      border-radius: 10px;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Consumer Recovery</h1>

    <p class="subtitle">
      Got a refund, cancellation, payment, or service problem?
      Tell us what happened and we'll help you create a recovery case.
    </p>

    <form id="recoveryForm">

      <label>Merchant / Company</label>
      <input
        type="text"
        id="merchant"
        placeholder="Example: Amazon"
        required
      >

      <label>Amount</label>
      <input
        type="number"
        id="amount"
        placeholder="Example: 4999"
        required
      >

      <label>What happened?</label>
      <textarea
        id="problem"
        placeholder="Example: I returned my product 10 days ago but haven't received my refund."
        required
      ></textarea>

      <label>What do you want recovered?</label>
      <textarea
        id="goal"
        placeholder="Example: I want my ₹4,999 refund."
        required
      ></textarea>

      <label>Upload evidence</label>
      <input type="file" id="evidence">

      <button type="submit">
        Start Recovery Case
      </button>

    </form>

    <div id="result">
      <h2>Recovery Case Created ✅</h2>
      <p><strong>Status:</strong> NEW</p>
      <p id="caseDetails"></p>
    </div>

  </div>

  <script>
    document
      .getElementById("recoveryForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const merchant =
          document.getElementById("merchant").value;

        const amount =
          document.getElementById("amount").value;

        const problem =
          document.getElementById("problem").value;

        const goal =
          document.getElementById("goal").value;

        document.getElementById("result").style.display = "block";

        document.getElementById("caseDetails").innerHTML =
          "Merchant: " + merchant +
          "<br>Amount: ₹" + amount +
          "<br><br>Problem: " + problem +
          "<br><br>Recovery Goal: " + goal;
      });
  </script>

</body>
</html>
